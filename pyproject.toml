[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recogni"
version = "0.1.0"
description = "Local-first character scene extraction desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
recogni = "recogni.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recogni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
